name: Android Release

on:
  push:
    tags:
      - 'v*' # 当推送以 v 开头的标签时触发
  workflow_dispatch: # 允许在 GitHub Actions 页面手动触发
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1). Leave empty to use v<versionName>.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            version="$(awk -F'"' '/^[[:space:]]*versionName[[:space:]]*=/{print $2; exit}' app/build.gradle.kts)"
            if [ -z "$version" ]; then
              echo "::error::Could not read versionName from app/build.gradle.kts"
              exit 1
            fi
            tag="v$version"
          fi
          if [[ ! "$tag" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::Invalid release tag '$tag' (expected something like v1.0.1)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Verify release tag target
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            existing="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG points to $existing, not $GITHUB_SHA. Bump versionName or pass a different tag."
              exit 1
            fi
            echo "Tag $TAG already exists at the current commit."
          else
            echo "Tag $TAG does not exist yet; it will be created at $GITHUB_SHA when the release is published."
          fi

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 repository secret is not configured"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > wiger_dev.jks
          test -s wiger_dev.jks

      - name: Verify signing secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret is not configured"
              exit 1
            fi
          done

      - name: Build with Gradle
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          echo "Verifying $apk with $apksigner"
          "$apksigner" verify --print-certs "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
