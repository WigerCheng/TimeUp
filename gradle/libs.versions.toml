ksp = "2.3.9"
room = "2.8.5"
hlit = "2.60.1"
material3 = "1.5.0-rc01"
appcompat = "1.7.1"
datastore = "1.1.7"
uiTextGoogleFonts = "1.12.1"
kotlinxCollectionsImmutable = "0.5.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
